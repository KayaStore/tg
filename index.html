<!DOCTYPE html>
<html>
<head>
    <script>
      (function() {
        const path = window.location.pathname.replace(/^\/|\/$/g, "");
        if (path) {
          window.location.href = "https://t.me/CodeSubs/" + encodeURIComponent(path);
        } else {
          window.location.href = "https://t.me/CodeSubs";
        }
      })();
    </script>
</head>
</html>
